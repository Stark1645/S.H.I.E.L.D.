spring.application.name=shield-backend
server.port=8080

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shield_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
jwt.access-expiration=86400000
jwt.refresh-expiration=604800000

# ML Service Configuration
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:3001

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=jarvis16451@gmail.com
spring.mail.password=ztmpsljrcnagpfgm
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Notification Configuration
notification.email.enabled=true
notification.email.to=727824tuit157@skct.edu.in,727824tuit153@skct.edu.in,727824tuit154@skct.edu.in
notification.email.from=jarvis16451@gmail.com

# Logging
logging.level.com.shield.service.EmailService=DEBUG
logging.level.org.springframework.mail=DEBUG

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}

# WebSocket Configuration
spring.websocket.allowed-origins=*

# SMS Configuration (Twilio)
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}
notification.sms.enabled=false

# SIEM Integration
siem.enabled=false
siem.splunk.url=${SPLUNK_URL:}
siem.splunk.token=${SPLUNK_TOKEN:}
siem.qradar.url=${QRADAR_URL:}
siem.qradar.token=${QRADAR_TOKEN:}
siem.elk.url=${ELK_URL:}

# Jaeger Tracing
jaeger.service.name=shield-backend
jaeger.agent.host=${JAEGER_AGENT_HOST:localhost}
jaeger.agent.port=${JAEGER_AGENT_PORT:6831}

# Multi-tenant
tenant.isolation.enabled=false
