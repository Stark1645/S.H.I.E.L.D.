spring.application.name=shield-backend
server.port=8080

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shield_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
jwt.access-expiration=86400000
jwt.refresh-expiration=604800000

# ML Service Configuration
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:3001

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Notification Configuration
notification.email.enabled=${NOTIFICATION_ENABLED:false}
notification.email.to=${NOTIFICATION_TO:recipient@example.com}
notification.email.from=${NOTIFICATION_FROM:sender@example.com}

# Logging
logging.level.com.shield.service.EmailService=DEBUG
logging.level.org.springframework.mail=DEBUG
