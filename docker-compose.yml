version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: shield-postgres
    environment:
      POSTGRES_DB: shield_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - shield-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: shield-jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "9411:9411"
    networks:
      - shield-network

  ml-service:
    build: ./ml-service-python
    container_name: shield-ml-service
    ports:
      - "8000:8000"
    networks:
      - shield-network

  backend:
    build: ./backend-java
    container_name: shield-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/shield_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      ML_SERVICE_URL: http://ml-service:8000
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: 6831
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - ml-service
      - jaeger
    networks:
      - shield-network

  frontend:
    build: .
    container_name: shield-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - shield-network

volumes:
  postgres-data:

networks:
  shield-network:
    driver: bridge
