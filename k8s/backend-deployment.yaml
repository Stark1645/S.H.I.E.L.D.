apiVersion: apps/v1
kind: Deployment
metadata:
  name: shield-backend
  labels:
    app: shield
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shield
      component: backend
  template:
    metadata:
      labels:
        app: shield
        component: backend
    spec:
      containers:
      - name: backend
        image: shield/backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_URL
          valueFrom:
            configMapKeyRef:
              name: shield-config
              key: database.url
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: shield-secrets
              key: database.username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shield-secrets
              key: database.password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: shield-secrets
              key: jwt.secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shield-backend-service
spec:
  selector:
    app: shield
    component: backend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: LoadBalancer
